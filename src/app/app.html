<div class="dashboard-container">
  <header class="navbar">
    <h1>🏢 {{ empresa.nombre }}</h1>
    <div class="clock">⏱️ {{ relojEnVivo }}</div>
  </header>

  <main class="content">
    <section class="card action-card">
      <h2>Marcaje de Asistencia - TickTock</h2>
      
      <div class="select-group">
        <label>Empleado:</label>
        <select [(ngModel)]="empleadoSeleccionadoId" (change)="alCambiarEmpleado()">
          <option *ngFor="let emp of empleados" [value]="emp.id">
            {{ emp.avatar }} {{ emp.nombre }} - {{ emp.puesto }}
          </option>
        </select>
      </div>

      <div class="button-group">
        <button class="btn btn-entrada" (click)="marcarEntrada()" [disabled]="estaEnTurno">
          🟢 Registrar Entrada
        </button>
        <button class="btn btn-salida" (click)="marcarSalida()" [disabled]="!estaEnTurno">
          🔴 Registrar Salida
        </button>
      </div>
    </section>

    <section class="card table-card">
      <h3>Historial de Marcajes</h3>
      <table>
        <thead>
          <tr>
            <th>Empleado</th>
            <th>Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let reg of registros">
            <td>{{ reg.empleadoNombre }}</td>
            <td>{{ reg.fecha }}</td>
            <td class="text-green">{{ reg.horaEntrada }}</td>
            <td class="text-red">{{ reg.horaSalida || '--:--:--' }}</td>
            <td><span class="badge">{{ reg.estado }}</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
